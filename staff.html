<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book & Tea House — Canlı Mutfak & Kafe Personel Paneli" />
    <title>Book & Tea House — Kafe Personel Paneli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="staff.css" />
  </head>
  <body>
    <div class="staff">
      <header class="staff-header">
        <div class="staff-header__brand">
          <div class="staff-header__crest">❧</div>
          <div>
            <p class="staff-header__eyebrow">Book & Tea House</p>
            <h1 class="staff-header__title">Mutfak & Adisyon Paneli</h1>
          </div>
        </div>

        <div class="staff-header__meta">
          <a class="staff-header__qr-link" href="qr.html">
            <span>📷 Masa QR Kodları</span>
          </a>
          <div class="live-status">
            <span class="pulse" id="liveDot" aria-hidden="true"></span>
            <span id="orderCount">0 aktif sipariş</span>
          </div>
        </div>
      </header>

      <div class="staff-controls">
        <button class="sound-toggle" id="soundToggle" type="button">
          <span>🔔 Sesli Bildirimleri Etkinleştir</span>
        </button>

        <div class="filters" role="tablist" aria-label="Durum filtresi">
          <button class="filter is-active" data-filter="all" type="button">
            <span>Tümü</span>
          </button>
          <button class="filter filter--new" data-filter="new" type="button">
            <span>✨ Yeni</span>
          </button>
          <button class="filter filter--prep" data-filter="preparing" type="button">
            <span>⏳ Hazırlanıyor</span>
          </button>
          <button class="filter filter--ready" data-filter="ready" type="button">
            <span>✓ Hazır</span>
          </button>
        </div>
      </div>

      <main class="board" id="board">
        <div class="empty" id="emptyState">
          <div class="empty__icon">☕</div>
          <p class="empty__title">Henüz Aktif Sipariş Bulunmuyor</p>
          <p class="empty__desc">Masalardan yeni bir sipariş geldiğinde burada anında görünecektir.</p>
        </div>
      </main>
    </div>

    <script src="staff.js"></script>
  </body>
</html>
