<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book n Tea — Kafe Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="staff.css" />
  </head>
  <body>
    <div class="staff">
      <header class="staff-header">
        <div>
          <p class="staff-header__eyebrow">Book n Tea</p>
          <h1 class="staff-header__title">Siparişler</h1>
        </div>
        <div class="staff-header__meta">
          <a class="staff-header__qr-link" href="qr.html">QR Kodları</a>
          <span class="pulse" id="liveDot" aria-hidden="true"></span>
          <span id="orderCount">0 aktif</span>
        </div>
      </header>

      <button class="sound-toggle" id="soundToggle" type="button">
        🔈 Sesi Etkinleştir
      </button>

      <div class="filters" role="tablist" aria-label="Durum filtresi">
        <button class="filter is-active" data-filter="all" type="button">
          Tümü
        </button>
        <button class="filter" data-filter="new" type="button">Yeni</button>
        <button class="filter" data-filter="preparing" type="button">
          Hazırlanıyor
        </button>
        <button class="filter" data-filter="ready" type="button">Hazır</button>
      </div>

      <main class="board" id="board">
        <p class="empty" id="emptyState">Henüz sipariş yok.</p>
      </main>
    </div>

    <script src="staff.js"></script>
  </body>
</html>
